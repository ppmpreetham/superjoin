[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    # CPU-only torch: sentence-transformers runs on CPU here; the default
    # CUDA build pulls ~3 GB of NVIDIA wheels into the Docker image.
    "torch>=2.9.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
